<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2026世界杯赛程订阅</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <div class="wrap hero">
        <div>
          <h1>2026世界杯赛程订阅</h1>
          <p>北京时间赛程日历，可在 Apple Calendar、Google Calendar、Outlook 等应用中通过 URL 订阅。</p>
        </div>
        <div class="actions">
          <a class="button" href="calendar.ics">下载 calendar.ics</a>
          <a class="button" href="webcal://example.com/calendar.ics" id="webcal-link">用日历应用订阅</a>
        </div>
        <p>订阅地址：<code id="calendar-url">calendar.ics</code></p>
      </div>
    </header>

    <main class="wrap">
      <section class="filters" aria-label="筛选赛程">
        <input id="search" type="search" placeholder="搜索球队、场馆、城市或比赛">
        <select id="stage">
          <option value="">全部阶段</option>
        </select>
      </section>

      <section class="summary" aria-label="赛程概览">
        <div class="stat"><strong id="match-count">0</strong><span>场比赛</span></div>
        <div class="stat"><strong id="date-count">0</strong><span>个比赛日</span></div>
        <div class="stat"><strong id="shown-count">0</strong><span>当前显示</span></div>
      </section>

      <section id="schedule" class="schedule">
        <div class="loading">正在读取赛程...</div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
