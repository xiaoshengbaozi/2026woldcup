<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2026世界杯赛程订阅</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f6f7f9;
        color: #172033;
      }

      main {
        width: min(680px, 100%);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 6vw, 44px);
        line-height: 1.12;
      }

      p {
        margin: 0 0 22px;
        color: #4d5a6f;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      a {
        color: inherit;
      }

      .button {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 16px;
        border: 1px solid #c6cfda;
        border-radius: 8px;
        background: #ffffff;
        font-weight: 650;
        text-decoration: none;
      }

      code {
        word-break: break-all;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #101419;
          color: #f2f5f8;
        }

        p {
          color: #b8c2cf;
        }

        .button {
          background: #1b232e;
          border-color: #354253;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>2026世界杯赛程订阅</h1>
      <p>北京时间赛程日历，可在 Apple Calendar、Google Calendar、Outlook 等应用中通过 URL 订阅。</p>
      <div class="actions">
        <a class="button" href="calendar.ics">下载 calendar.ics</a>
        <a class="button" href="webcal://example.com/calendar.ics" id="webcal-link">用日历应用订阅</a>
      </div>
      <p style="margin-top: 24px;">订阅地址：<code id="calendar-url">calendar.ics</code></p>
    </main>
    <script>
      const url = new URL("calendar.ics", window.location.href);
      document.getElementById("calendar-url").textContent = url.href;
      document.getElementById("webcal-link").href = url.href.replace(/^https?:/, "webcal:");
    </script>
  </body>
</html>
