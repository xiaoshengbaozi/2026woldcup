name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          NEXT_PUBLIC_MARKET_API_URL: ${{ vars.NEXT_PUBLIC_MARKET_API_URL || secrets.NEXT_PUBLIC_MARKET_API_URL }}
          NEXT_PUBLIC_MARKET_WS_URL: ${{ vars.NEXT_PUBLIC_MARKET_WS_URL || secrets.NEXT_PUBLIC_MARKET_WS_URL }}
          NEXT_PUBLIC_NEWS_API_URL: ${{ vars.NEXT_PUBLIC_NEWS_API_URL || secrets.NEXT_PUBLIC_NEWS_API_URL }}
          NEXT_PUBLIC_USER_API_URL: ${{ vars.NEXT_PUBLIC_USER_API_URL || secrets.NEXT_PUBLIC_USER_API_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=world-cup-2026 --branch=${{ github.ref_name }} --commit-dirty=true
